databases:
  - name: kahoot-db
    databaseName: kahoot
    user: kahoot_user

services:
  - type: web
    name: kahoot-awareness-backend
    env: docker
    rootDir: server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: kahoot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kahoot-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: kahoot-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: kahoot-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: kahoot-db
          property: password
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: "https://lmsgen.in,https://www.lmsgen.in,https://quizmoto-frontend.onrender.com,https://kahoot-awareness-frontend.onrender.com"
      - key: APP_BASE_URL
        value: "https://lmsgen.in"
      - key: PUBLIC_FRONTEND_URL
        value: "https://lmsgen.in"
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_HOST
        value: "smtpout.secureserver.net"
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_SECURE
        value: "true"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_ADMIN_TO
        sync: false

  - type: web
    name: kahoot-awareness-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: kahoot-awareness-backend
          envVarKey: RENDER_EXTERNAL_URL
