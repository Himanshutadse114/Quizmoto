databases:
  - name: kahoot-db
    databaseName: kahoot
    user: kahoot_user

services:
  - type: web
    name: kahoot-awareness-backend
    env: docker
    rootDir: server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: kahoot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kahoot-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: kahoot-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: kahoot-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: kahoot-db
          property: password
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://quizmoto-frontend.onrender.com,https://kahoot-awareness-frontend.onrender.com"

  - type: web
    name: kahoot-awareness-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: kahoot-awareness-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      # Serve the pre-built marketing pages directly so the browser never has
      # to boot the React app just to redirect away from it (was causing a
      # full double page-load, and the visible lag, on every homepage visit).
      - type: rewrite
        source: /
        destination: /landing/index.html
      - type: rewrite
        source: /solutions
        destination: /landing/solutions/index.html
      - type: rewrite
        source: /about
        destination: /landing/about/index.html
      - type: rewrite
        source: /blog
        destination: /landing/blog/index.html
      - type: rewrite
        source: /contact
        destination: /landing/contact/index.html
      # Everything else is a client-side route handled by the React app.
      - type: rewrite
        source: /*
        destination: /index.html
