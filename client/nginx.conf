server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the public marketing site as real static documents. This keeps the
    # homepage and secondary marketing pages out of the React/Suspense/iframe
    # path, eliminating the visible loading state during normal navigation.
    location = / {
        rewrite ^ /landing/index.html break;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /solutions {
        rewrite ^ /landing/solutions/index.html break;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /about {
        rewrite ^ /landing/about/index.html break;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /blog {
        rewrite ^ /landing/blog/index.html break;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /contact {
        rewrite ^ /landing/contact/index.html break;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /solutions/ { return 308 /solutions$is_args$args; }
    location = /about/ { return 308 /about$is_args$args; }
    location = /blog/ { return 308 /blog$is_args$args; }
    location = /contact/ { return 308 /contact$is_args$args; }

    # Direct copies of the prebuilt marketing documents are intentionally
    # available too. nav-menu.js normalises their visible URL back to the
    # friendly route, which also gives static-only hosts a no-iframe fallback.
    location ~ ^/landing/(?:index|solutions/index|about/index|blog/index|contact/index)\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location /api/ {
        proxy_pass http://backend:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://backend:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # React application routes: login, Atelora workspace, live Quizmoto and
    # player/host flows continue to use the SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
