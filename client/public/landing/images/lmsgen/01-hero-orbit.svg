<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-label="LMSGEN platform with rotating services">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="42%">
      <stop offset="0" stop-color="#4FC9BF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#4FC9BF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4FC9BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ring { fill: none; stroke: #4FC9BF; stroke-dasharray: 5 14; }
      .spin { transform-origin: 700px 430px; animation: spin 42s linear infinite; }
      .hold { animation: hold 42s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes hold { to { transform: rotate(-360deg); } }
    </style>
  </defs>

  <rect width="1400" height="920" fill="#0A0F0E"/>
  <ellipse cx="700" cy="430" rx="420" ry="300" fill="url(#glow)"/>

  <ellipse class="ring" cx="700" cy="430" rx="470" ry="250" stroke-opacity="0.28" stroke-width="1.4"/>
  <ellipse class="ring" cx="700" cy="430" rx="390" ry="200" stroke-opacity="0.16" stroke-width="1"/>
  <ellipse cx="700" cy="430" rx="168" ry="168" fill="none" stroke="#4FC9BF" stroke-opacity="0.14" stroke-width="1"/>

  <g transform="translate(700 400)" filter="url(#soft)">
    <g fill="none" stroke="#7BDCD3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-78 -8 h46 a10 10 0 0 1 10 10 v78 a10 10 0 0 1 -10 10 h-46 a10 10 0 0 1 -10 -10 v-78 a10 10 0 0 1 10 -10z"/>
      <path d="M-68 18 h36 M-68 36 h28 M-68 54 h32"/>
      <circle cx="46" cy="18" r="11"/>
      <circle cx="86" cy="8" r="8"/>
      <circle cx="92" cy="52" r="10"/>
      <circle cx="48" cy="68" r="8"/>
      <path d="M55 26 L80 14 M54 28 L84 46 M90 18 L92 42 M56 60 L84 56"/>
    </g>
    <g fill="none" stroke="#4FC9BF" stroke-width="2.4" stroke-linejoin="round">
      <path d="M-70 118 L0 96 L70 118 L0 140 Z"/>
      <path d="M-58 132 L0 152 L58 132" opacity="0.7"/>
      <path d="M-46 144 L0 162 L46 144" opacity="0.45"/>
    </g>
    <text y="188" text-anchor="middle" fill="#EDF4F2" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">LMSGEN</text>
  </g>

  <g class="spin">
    <g transform="translate(700 180)">
      <g class="hold">
        <rect x="-62" y="-18" width="124" height="36" rx="18" fill="#071412" stroke="#4FC9BF" stroke-width="1.4"/>
        <text y="5" text-anchor="middle" fill="#9BE8E1" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.4">AI STUDIO</text>
      </g>
    </g>
    <g transform="translate(1040 300)">
      <g class="hold">
        <rect x="-52" y="-18" width="104" height="36" rx="18" fill="#071412" stroke="#4FC9BF" stroke-width="1.4"/>
        <text y="5" text-anchor="middle" fill="#9BE8E1" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.4">SCORM</text>
      </g>
    </g>
    <g transform="translate(1080 520)">
      <g class="hold">
        <rect x="-64" y="-18" width="128" height="36" rx="18" fill="#071412" stroke="#4FC9BF" stroke-width="1.4"/>
        <text y="5" text-anchor="middle" fill="#9BE8E1" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.4">QUIZMOTO</text>
      </g>
    </g>
    <g transform="translate(700 680)">
      <g class="hold">
        <rect x="-58" y="-18" width="116" height="36" rx="18" fill="#071412" stroke="#4FC9BF" stroke-width="1.4"/>
        <text y="5" text-anchor="middle" fill="#9BE8E1" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.4">PUBLISH</text>
      </g>
    </g>
    <g transform="translate(320 520)">
      <g class="hold">
        <rect x="-56" y="-18" width="112" height="36" rx="18" fill="#071412" stroke="#4FC9BF" stroke-width="1.4"/>
        <text y="5" text-anchor="middle" fill="#9BE8E1" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.4">REPORTS</text>
      </g>
    </g>
    <g transform="translate(360 300)">
      <g class="hold">
        <rect x="-62" y="-18" width="124" height="36" rx="18" fill="#071412" stroke="#4FC9BF" stroke-width="1.4"/>
        <text y="5" text-anchor="middle" fill="#9BE8E1" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.4">LEARNERS</text>
      </g>
    </g>
  </g>

  <g transform="translate(700 830)">
    <rect x="-150" y="-18" width="300" height="36" rx="18" fill="none" stroke="#4FC9BF" stroke-opacity="0.35" stroke-width="1.2"/>
    <text y="5" text-anchor="middle" fill="#7BDCD3" font-family="Inter,Arial,sans-serif" font-size="13" letter-spacing="1.6">AUTHOR  ·  PUBLISH  ·  TRACK</text>
  </g>
</svg>
