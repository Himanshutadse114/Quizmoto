<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-label="LMSGEN learning flow diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061614"/>
      <stop offset="1" stop-color="#050C0B"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#4FC9BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4FC9BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC9BF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#4FC9BF"/>
      <stop offset="0.82" stop-color="#9BE8E1"/>
      <stop offset="1" stop-color="#9BE8E1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4FC9BF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .flow { stroke-dasharray: 12 18; animation: dash 2.4s linear infinite; }
      .flow-slow { stroke-dasharray: 8 22; animation: dash 3.6s linear infinite reverse; }
      .orbit { animation: blink 1.8s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -120; } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1600" height="820" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="820" rx="28" fill="url(#grid)"/>
  <ellipse cx="800" cy="390" rx="620" ry="260" fill="url(#aura)"/>
