  <path class="flow" d="M310 318 C 430 250, 560 228, 690 250" fill="none" stroke="url(#beam)" stroke-width="2.4" filter="url(#glow)"/>
  <path class="flow" d="M910 250 C 1040 228, 1170 250, 1290 318" fill="none" stroke="url(#beam)" stroke-width="2.4" filter="url(#glow)"/>
  <path class="flow" d="M310 502 C 470 430, 620 390, 800 390" fill="none" stroke="url(#beam)" stroke-width="2.6" filter="url(#glow)"/>
  <path class="flow" d="M800 390 C 980 390, 1130 430, 1290 502" fill="none" stroke="url(#beam)" stroke-width="2.6" filter="url(#glow)"/>
  <path class="flow" d="M690 250 C 740 310, 770 350, 800 390" fill="none" stroke="#7BDCD3" stroke-width="2" filter="url(#glow)"/>
  <path class="flow" d="M910 250 C 860 310, 830 350, 800 390" fill="none" stroke="#7BDCD3" stroke-width="2" filter="url(#glow)"/>
  <path class="flow" d="M800 430 C 800 500, 800 560, 800 620" fill="none" stroke="url(#beam)" stroke-width="2.2" filter="url(#glow)"/>
  <circle class="orbit" cx="430" cy="268" r="3.2" fill="#9BE8E1"/>
