    <circle class="pulse" r="128" fill="none" stroke="#4FC9BF" stroke-opacity="0.12" stroke-width="1"/>
    <text y="-8" text-anchor="middle" fill="#EDF4F2" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">LMSGEN</text>
    <text y="18" text-anchor="middle" fill="#9BE8E1" font-family="Inter,Arial,sans-serif" font-size="12">one workspace</text>
  </g>
