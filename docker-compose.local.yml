version: '3.3'

services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: CHANGE_ME_ROTATE
      MYSQL_DATABASE: kahoot_awareness
      MYSQL_USER: platform
      MYSQL_PASSWORD: CHANGE_ME_ROTATE
    volumes:
      - ./mysql_data_local:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "9085:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  frontend:
    build: ./client
    ports:
      - "9083:80"
    depends_on:
      - backend

  backend:
    build: ./server
    ports:
      - "6001:5001"
    environment:
      - PORT=5001
      - JWT_SECRET=CHANGE_ME_ROTATE
      - NODE_ENV=development
      - CORS_ORIGIN=*
      - DB_DIALECT=mysql
      - DB_HOST=db
      - DB_NAME=kahoot_awareness
      - DB_USER=platform
      - DB_PASS=CHANGE_ME_ROTATE
    depends_on:
      - db
    volumes:
      - ./server/data:/app/data
    restart: always
