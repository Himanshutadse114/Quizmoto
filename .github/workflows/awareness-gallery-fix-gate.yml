name: Awareness Gallery Fix Gate

on:
  push:
    branches:
      - fix-awareness-gallery-seed-css
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Install client dependencies
        run: npm install --prefix client
      - name: Run awareness gallery tests
        run: |
          cd server
          npx mocha tests/AwarenessTemplateGalleryService.test.js tests/AwarenessMailDeliveryService.test.js --exit
      - name: Verify R2 environment aliases
        run: |
          node - <<'NODE'
          process.env.STORAGE_DRIVER='s3';
          process.env.R2_BUCKET='awareness-test';
          process.env.R2_ENDPOINT='https://example.r2.cloudflarestorage.com';
          process.env.R2_ACCESS_KEY_ID='test-key';
          process.env.R2_SECRET_ACCESS_KEY='test-secret';
          delete process.env.S3_BUCKET;
          delete process.env.AWS_ACCESS_KEY_ID;
          delete process.env.AWS_SECRET_ACCESS_KEY;
          const { createObjectStorage } = require('./server/storage/ObjectStorage');
          const storage = createObjectStorage();
          if (storage.bucket !== 'awareness-test' || storage.driver !== 's3') process.exit(1);
          NODE
      - name: Build client
        run: npm run build --prefix client
      - name: Syntax checks
        run: |
          node --check server/routes/scorm/awarenessGallery.js
          node --check server/services/awareness/AwarenessTemplateGalleryService.js
          node --check server/storage/ObjectStorage.js
          node --check server/storage/S3ObjectStorage.js
