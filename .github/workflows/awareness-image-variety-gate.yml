name: Awareness Image Variety Gate

on:
  push:
    branches:
      - fix-awareness-image-variety
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Install client dependencies
        run: npm install --prefix client
      - name: Run awareness tests
        run: |
          cd server
          npx mocha tests/AwarenessEmailRenderer.test.js tests/AwarenessMailDeliveryService.test.js tests/AwarenessTemplateService.test.js --exit
      - name: Build client
        run: npm run build --prefix client
      - name: Syntax check
        run: |
          node --check server/services/awareness/AwarenessTemplateService.js
          node --check server/services/awareness/AwarenessEmailRenderer.js
