name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: quizmototest
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d quizmototest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install root dependencies
      run: npm install

    - name: Install server dependencies
      run: npm install --prefix server

    - name: Install client dependencies
      run: npm install --prefix client

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Build client
      shell: bash
      run: |
        set -o pipefail
        npm --prefix client run build 2>&1 | tee client-build.log

    - name: Run server unit tests
      run: npm --prefix server test

    - name: Run SCORM PostgreSQL persistence tests
      working-directory: server
      env:
        NODE_ENV: test
        DB_DIALECT: postgres
        DB_HOST: localhost
        DB_PORT: 5434
        DB_NAME: quizmototest
        DB_USER: testuser
        DB_PASS: testpass
        DB_SSL: "false"
        JWT_SECRET: ci_scorm_runtime_secret
      run: |
        npx mocha tests/ScormLearningStatePostgres.test.js --exit
        npx mocha tests/ScormRuntimePostgres.test.js --exit

    - name: Run E2E tests
      shell: bash
      run: |
        set -o pipefail
        npm run test:e2e 2>&1 | tee playwright-e2e.log

    - name: Upload E2E diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-diagnostics-${{ github.run_id }}
        if-no-files-found: ignore
        retention-days: 7
        path: |
          client-build.log
          playwright-e2e.log
          test-results/
          playwright-report/
